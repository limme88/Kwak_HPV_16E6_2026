# Initial 5-microsecond Desmond production settings.
# Inputs: matching MSJ relaxation protocol and dated CMS system.
# Outputs: native trajectory, energies and final system/checkpoint files.
# Supports the unbiased ensemble used throughout the manuscript.
annealing = false
backend = {
}
bigger_rclone = false
box = ?
checkpt = {
   first = 0.0
   interval = 240.06
   name = "$JOBNAME.cpt"
   write_last_step = true
}
cpu = 1
cutoff_radius = 9.0
dipole_moment = false
ebias_force = false
elapsed_time = 0.0
energy_group = false
eneseq = {
   first = 0.0
   interval = 1.2
   name = "$JOBNAME$[_replica$REPLICA$].ene"
}
ensemble = {
   barostat = {
      tau = 2.0
   }
   class = NPT
   method = MTK
   thermostat = {
      tau = 1.0
   }
}
gaussian_force = false
glue = solute
maeff_output = {
   center_atoms = solute
   first = 0.0
   interval = 120.0
   name = "$JOBNAME$[_replica$REPLICA$]-out.cms"
   periodicfix = true
   trjdir = "$JOBNAME$[_replica$REPLICA$]_trj"
}
meta = false
meta_file = ?
msd = false
pressure = [1.01325 isotropic ]
pressure_tensor = false
randomize_velocity = {
   first = 0.0
   interval = inf
   seed = 7800
   temperature = "@*.temperature"
}
restrain = none
restraints = {
   existing = ignore
   new = []
}
rnemd = false
simbox = {
   first = 0.0
   interval = 1.2
   name = "$JOBNAME$[_replica$REPLICA$]_simbox.dat"
}
spatial_temperature = false
surface_tension = 0.0
taper = false
temperature = [
   [310.0 0 ]
]
time = 5000000.0
timestep = [0.002 0.002 0.006 ]
trajectory = {
   center = []
   first = 0.0
   format = dtr
   frames_per_file = 250
   interval = 100.0
   name = "$JOBNAME$[_replica$REPLICA$]_trj"
   periodicfix = true
   write_last_vel = false
   write_velocity = false
}
wall_force = false

